<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NICU Night Shift</title>
<script>
/* Everything this page loads is tagged with the version index.html passed on the URL, so
   the whole game is cache-busted by the single BUILD constant over there.

   Opened DIRECTLY, with no ?v=, it tags with the time instead. That is the editing path,
   and "no tag" was exactly the wrong default for it: with no Cache-Control header a
   browser will happily serve a file it fetched a minute ago, so an edit appears to do
   nothing. That has now cost this project a debugging session twice. */
(function () {
  var v = (/[?&]v=([^&]*)/.exec(location.search) || [])[1] || ("dev" + Date.now());
  window.__q = "?v=" + encodeURIComponent(v);
  document.write('<link rel="stylesheet" href="css/game.css' + window.__q + '">');
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <span class="brand">🌙 <span class="brand-word">NICU Night Shift</span></span>
    <div>
      <div class="clock" id="clock" role="timer" aria-label="Shift clock">19:00</div>
      <div class="clock-sub" id="clockSub">12h 0m left</div>
    </div>
    <div class="speed">
      <button id="btnPause" aria-pressed="true">▶ Resume</button>
      <!-- how fast the clock is running, and why. The player does not set it; where they
           are and what is waiting for them does. -->
      <span class="clock-state" id="clockState" aria-hidden="true"></span>
    </div>
    <span class="spacer"></span>
    <div class="topbar-stats">
      <span class="pill-stat level-pill" id="statLevel"></span>
      <span class="pill-stat" id="statAlarm">Alarms <b>0</b></span>
      <span class="pill-stat" id="statTrust">Family trust <b>55</b></span>
      <span class="pill-stat mono dim" id="seedLabel">seed</span>
    </div>
    <div class="topbar-actions">
      <button class="side-toggle" id="btnSide" aria-expanded="false" aria-controls="side"><span class="lbl">Waiting</span><span class="n" id="sideCount">0</span></button>
      <button class="phone-btn" id="btnPhone" title="No calls">☎</button>
      <button class="btn ghost small" id="btnSound" aria-pressed="true">🔊</button>
      <button class="btn ghost small" id="btnEnd">End shift</button>
    </div>
  </header>
  <div class="main">
    <main class="stage" id="stage" tabindex="-1"></main>
    <aside class="side" id="side" aria-label="Who needs you, the team, and the shift log"></aside>
  </div>
</div>
<!-- One polite live region for the whole game. See css/game.css for why the callout and
     the side panel are deliberately NOT live regions themselves. -->
<div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
/* document.write keeps these parser-blocking and in order, which they must be: game.js
   depends on every file above it. */
["util", "clinical", "audio", "glossary", "names", "art", "sim", "patients", "deliveries", "events", "game", "director", "deliveryroom", "ui", "actions", "report"]
  .forEach(function (n) { document.write('<script src="js/' + n + '.js' + window.__q + '"><\/script>'); });
</script>
</body>
</html>
